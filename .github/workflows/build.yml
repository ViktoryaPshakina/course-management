name: Java CI with SAST, SCA and DAST

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn clean package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: package-jar
          path: target/*.jar

  sast:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST Scan
        run: |
          docker run --rm -v $(pwd):/src returntocorp/semgrep semgrep scan --config auto --sarif --output=semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()

  sca:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run SCA
        # Игнорируем ошибки NVD (exit 0)
        run: mvn org.owasp:dependency-check-maven:check -DfailOnError=false || true
      - uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: target/dependency-check-report.html
        if: always()

  dast:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package-jar
          path: target
      - name: Run App and Scan
        run: |
          # 1. Подготовка
          touch zap-rules.tsv
          chmod 777 $(pwd)
          
          # 2. Запуск приложения в фоне
          java -jar target/*.jar > app.log 2>&1 &
          echo "Waiting for app to start..."
          sleep 40
          
          # 3. Запуск Baseline Scan через Docker (сеть host позволит увидеть localhost:8080)
          docker run --rm --network="host" -v $(pwd):/zap/wrk/:rw zaproxy/zap-stable zap-baseline.py \
            -t http://localhost:8080 \
            -c zap-rules.tsv \
            -r baseline-report.html || echo "ZAP found issues"

          # 4. Запуск API Scan (если упадет - не страшно)
          docker run --rm --network="host" -v $(pwd):/zap/wrk/:rw zaproxy/zap-stable zap-api-scan.py \
            -t http://localhost:8080/v3/api-docs \
            -f openapi \
            -c zap-rules.tsv \
            -r api-report.html || echo "ZAP API Scan failed or no OpenAPI spec"

      - name: Upload DAST Reports
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports
          path: |
            baseline-report.html
            api-report.html
        if: always()